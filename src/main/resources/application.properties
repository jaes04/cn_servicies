spring.application.name=cn_servicies

spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:cn_test}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:change_me}
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Sin valor por defecto a proposito: si falta JWT_SECRET la aplicacion no debe
# arrancar. Un fallback aqui significa firmar tokens con una clave conocida.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# Coste de BCrypt. Cada punto dobla lo que cuesta comprobar una contrasena, que
# es lo que encarece probarlas a millones si se filtra la tabla de usuarios.
# Bajarlo de 12 solo tiene sentido en una maquina muy justa, y se nota en la
# seguridad antes que en el reloj.
app.security.bcrypt-strength=${BCRYPT_STRENGTH:12}

# Limite de intentos de login. Dos cuentas separadas y cualquiera bloquea: la de
# la cuenta es la estricta —quien prueba contrasenas contra un usuario concreto
# se queda sin intentos enseguida— y la de la IP es la red de seguridad contra
# quien prueba una contrasena en muchas cuentas.
#
# Un acierto borra las dos, para que el club entero detras del wifi de la
# piscina no se quede fuera por los despistes de uno. El bloqueo se dobla cada
# vez que se vuelve a agotar, hasta el tope.
app.login.max-attempts-per-user=${LOGIN_MAX_ATTEMPTS_PER_USER:5}
app.login.max-attempts-per-ip=${LOGIN_MAX_ATTEMPTS_PER_IP:30}
app.login.window-minutes=${LOGIN_WINDOW_MINUTES:15}
app.login.lock-minutes=${LOGIN_LOCK_MINUTES:5}
app.login.max-lock-minutes=${LOGIN_MAX_LOCK_MINUTES:60}

# Politica de contrasenas. Longitud y listas, sin composicion forzada: exigir
# mayuscula, numero y simbolo produce "Password1!" —corta, conocida y apuntada en
# un papel— y no produce contrasenas mejores.
#
# El minimo de 12 ya tumba casi todas las contrasenas famosas, asi que la lista
# incluida (passwords-comunes.txt) cubre sobre todo las conocidas que pasan de 12
# y las del contexto de un club. Para usar una lista grande —SecLists, rockyou—
# se apunta blocklist-file a ese archivo y se suma a la incluida.
app.security.password.min-length=${PASSWORD_MIN_LENGTH:12}
app.security.password.blocklist-file=${PASSWORD_BLOCKLIST_FILE:}

# Club creado en el primer arranque si no existe ninguno con este slug, junto
# con el administrador de ADMIN_USERNAME/ADMIN_PASSWORD (AdminInitializer).
# Tiene que coincidir con el club que siembra data.sql: si no coinciden, el
# arranque no encuentra el de data.sql y crea uno nuevo con el admin, dejando
# dos clubes donde solo uno tiene quien entre.
app.default-club-slug=${DEFAULT_CLUB_SLUG:cn-demo}
app.default-club-name=${DEFAULT_CLUB_NAME:CN demo}

# Detras de un proxy —Cloudflare Tunnel— la IP de la conexion es la del proxy y
# todo el mundo comparte el limite de arriba. Poniendo "framework" Spring lee
# X-Forwarded-For y vuelve a distinguir a cada uno.
#
# Apagado por defecto a proposito: sin un proxy delante que reescriba esa
# cabecera, la pone quien quiere y cualquiera se inventaria una IP por intento.
# Encenderlo solo cuando la API no sea alcanzable mas que a traves del tunel.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

app.upload.dir=${UPLOAD_DIR:uploads}

# Subida de documentos a la ficha del atleta (bloque 3a).
#
# Apagada por defecto: para el despliegue inicial el club registra que los
# papeles se entregaron y hasta cuando valen (document_delivery), y no los sube.
# Encenderla vuelve a guardar archivos que pueden contener datos de salud de
# menores, y antes de hacerlo faltan cifrado en reposo, un directorio separado
# de las imagenes publicas y el registro de accesos. Ver docs/rgpd.md §1.
app.documents.upload.enabled=${DOCUMENTS_UPLOAD_ENABLED:false}
app.base-url=${BASE_URL:http://localhost:8080}
server.port=${PORT:8080}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=55MB
# Generacion automatica de sesiones (tarea 2.2.b).
#
# Apagarla no rompe nada: las sesiones se siguen pudiendo generar a mano desde
# POST /api/groups/{id}/sessions/generation. Lo que se pierde es que el
# calendario se mantenga solo.
#
# Con mas de una instancia conviene dejarla encendida en una sola: dos replicas
# no duplicarian nada —la generacion es idempotente— pero harian el trabajo dos
# veces.
app.sessions.generation.enabled=${SESSION_GENERATION_ENABLED:true}

# De madrugada, cuando nadie esta pasando lista: generar toca muchas filas.
app.sessions.generation.cron=${SESSION_GENERATION_CRON:0 30 3 * * *}

# Cuantas semanas por delante se mantienen generadas. Lo comparten el job y la
# regeneracion al cambiar un horario.
app.sessions.generation.weeks-ahead=${SESSION_GENERATION_WEEKS_AHEAD:6}
