services:
  db:
    # Version fija y del mismo major que la de desarrollo (PostgreSQL 18), donde
    # corren los tests. Con la 16 se desplegaba sobre un motor distinto del
    # unico contra el que se ha probado nada.
    #
    # OJO AL SUBIR DE MAJOR CON DATOS: un volumen creado por la 16 no lo lee la
    # 18, el contenedor no arranca y hace falta pg_upgrade o un dump y restore.
    # Hoy no hay datos en ningun volumen; el dia que los haya, esto se cambia
    # con el procedimiento de docs/despliegue.md delante.
    image: postgres:18.6-bookworm
    restart: unless-stopped
    environment:
      # El superusuario del contenedor es el rol de migraciones, NO el de la
      # aplicacion. Con PGUSER aqui, un volumen nuevo crearia a cn_app como
      # superusuario y se saltaria sus propias policies de Row Level Security.
      POSTGRES_DB: ${PGDATABASE}
      POSTGRES_USER: ${MIGRATION_USER}
      POSTGRES_PASSWORD: ${MIGRATION_PASSWORD}
      # Solo lo lee docker/initdb/01-rol-aplicacion.sh, para crear cn_app con
      # su contrasena la primera vez que arranca el volumen.
      APP_DB_PASSWORD: ${PGPASSWORD}
    volumes:
      # EN /var/lib/postgresql, NO en /var/lib/postgresql/data. Desde la 18 la
      # imagen guarda los datos en un subdirectorio por version (18/docker), y
      # con el montaje antiguo el contenedor se niega a arrancar. Comprobado.
      - pgdata:/var/lib/postgresql
      # Lo que hay aqui corre UNA vez, al inicializar un volumen vacio: crea el
      # rol de la aplicacion antes de que la API intente conectarse.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - ./migrations:/migraciones:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MIGRATION_USER} -d ${PGDATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # La aplicacion se conecta con cn_app: sin BYPASSRLS y sujeto a las
      # policies. Si aqui vuelve a aparecer el rol de migraciones, el
      # aislamiento entre clubes deja de existir.
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${PGDATABASE}
      SPRING_DATASOURCE_USERNAME: ${PGUSER}
      SPRING_DATASOURCE_PASSWORD: ${PGPASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      UPLOAD_DIR: /app/uploads
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # Detras del tunel tiene que llegar "framework", o el limite de intentos de
      # login ve a todo el mundo con la IP del proxy. Sin esta linea, ponerlo en
      # el .env no hacia nada: el contenedor solo recibe lo que se lista aqui.
      FORWARD_HEADERS_STRATEGY: ${FORWARD_HEADERS_STRATEGY:-none}
    volumes:
      - uploads:/app/uploads

  tunnel:
    # Fijada: con :latest, un reinicio cualquiera cambia la version del proceso
    # que sostiene el unico camino hacia la API, y si esa version trae un fallo
    # el sintoma es "el sitio no responde" sin que nada haya cambiado aqui.
    image: cloudflare/cloudflared:2026.9.1
    restart: unless-stopped
    depends_on:
      - api
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}

volumes:
  pgdata:
  uploads: